<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6f5c" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Scan your supplements, enter your daily routine and get a personalized schedule with reminders."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SmartStack" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>SmartStack</title>
    <script>
      // The stored theme before the first paint; the app applies it again once loaded.
      try {
        var stored = JSON.parse(localStorage.getItem('smartstack:v1') || 'null')
        if (stored && typeof stored.theme === 'string') {
          document.documentElement.setAttribute('data-theme', stored.theme)
        }
      } catch (e) {
        // Private mode or blocked storage: the default theme paints.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
