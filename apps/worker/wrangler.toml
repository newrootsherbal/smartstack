# New Roots SmartStack — one Worker on the Cloudflare free plan.
# Serves apps/web/dist as static assets, handles /api/*, and runs a Cron
# Trigger every minute to send Web Push reminders from D1.
name = "smartstack"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Smaller upload (zod + hono); the free plan allows 3 MB compressed either way.
minify = true

# Production origin. The zone is on Cloudflare in the same account, so wrangler creates
# the DNS record and certificate on deploy. Push subscriptions are tied to this origin:
# changing it means every phone re-subscribes.
routes = [{ pattern = "schedule.flourishbodyandmind.com", custom_domain = true }]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# API requests must always reach the Worker, never the SPA fallback.
# /__scheduled: `wrangler dev --test-scheduled` fires the cron through the Worker; harmless in prod.
run_worker_first = ["/api/*", "/__scheduled"]

[observability]
enabled = true

[triggers]
# Every minute. Cron invocations count toward the 100k/day request limit (1,440/day).
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "smartstack"
# Created 2026-09-24 with `wrangler d1 create smartstack` on the newrootsherbal account.
database_id = "38e99127-9e06-4017-8853-52186ae5b389"
migrations_dir = "migrations"

[vars]
# Public VAPID key (base64url). The private half is a secret:
#   local: apps/worker/.dev.vars    prod: `wrangler secret put VAPID_PRIVATE_KEY`
VAPID_PUBLIC_KEY = "BProg2B-2MpQYotwZwsJOIHc_rTVBisevREVnVVZ0bPc5MggyMDxvjeVR45kW9RHKHuzKNcRzUA3-ejU3ZWWWbY"
# Contact address sent to the push services with every VAPID token.
VAPID_SUBJECT = "mailto:hosts@newrootsherbal.com"
# Reminders claimed per cron tick. Start at 20; raise toward 45 only after
# Workers Logs show a full batch under ~6 ms CPU.
MAX_PUSHES_PER_TICK = "20"
# Must match VITE_BETA_KEY in apps/web/.env. A speed bump, not security.
BETA_KEY = "qEjK2x-cvUwSsn4qF-1RsKhd"
# Origin the app is served from: OAuth redirects and email links are built from it.
APP_ORIGIN = "https://schedule.flourishbodyandmind.com"
# Accounts launch gate: off | staff | public. Production stays "staff" (only addresses in
# STAFF_EMAIL_DOMAINS can sign up or log in) until the Law 25 launch checklist is done
# (docs/smartstack-phase2-setup.md, part F). Must match VITE_ACCOUNTS_MODE in apps/web/.env.
ACCOUNTS_MODE = "staff"
# Comma-separated email domains allowed while ACCOUNTS_MODE is "staff".
STAFF_EMAIL_DOMAINS = "newrootsherbal.com"
# Sign in with Apple waits for the Apple Developer Program enrollment.
APPLE_ENABLED = "false"

# ---------------------------------------------------------------------------
# Staging: https://schedule-staging.flourishbodyandmind.com, its own D1 database.
# Deploy from the repository root with `npm run deploy:staging` (staging build of the web app,
# then `wrangler deploy --env staging`), or run the "Deploy staging" workflow.
# vars, bindings and assets are not inherited by environments, so they are all repeated.
# One level below the zone, so the free Universal SSL certificate covers it.
# ---------------------------------------------------------------------------
[env.staging]
routes = [{ pattern = "schedule-staging.flourishbodyandmind.com", custom_domain = true }]

[env.staging.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/__scheduled"]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "smartstack-staging"
# Created 2026-09-29 with `wrangler d1 create smartstack-staging --location enam`.
database_id = "94c2d88e-4b1f-4145-b402-e6528bb3face"
migrations_dir = "migrations"

[env.staging.vars]
# Same VAPID pair as production: subscriptions are per origin anyway.
VAPID_PUBLIC_KEY = "BProg2B-2MpQYotwZwsJOIHc_rTVBisevREVnVVZ0bPc5MggyMDxvjeVR45kW9RHKHuzKNcRzUA3-ejU3ZWWWbY"
VAPID_SUBJECT = "mailto:hosts@newrootsherbal.com"
MAX_PUSHES_PER_TICK = "20"
BETA_KEY = "qEjK2x-cvUwSsn4qF-1RsKhd"
APP_ORIGIN = "https://schedule-staging.flourishbodyandmind.com"
ACCOUNTS_MODE = "public"
STAFF_EMAIL_DOMAINS = "newrootsherbal.com"
APPLE_ENABLED = "false"
