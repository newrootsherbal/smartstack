# Deploys the Worker (and the web app it serves) on every push to main, so merging
# the weekly catalogue PR ships the new data. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN  — an API token on the newrootsherbal account with
#                           Account > Workers Scripts > Edit and Account > D1 > Edit
#                           (setup doc, part B2)
#   CLOUDFLARE_ACCOUNT_ID — the account id shown by `wrangler whoami`
# New D1 migrations are applied before the new code is deployed. Every migration must be
# additive, so the code still running keeps working between the two steps.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build the web app
        run: npm run build
      - name: Apply D1 migrations
        # Only this step and the next see the Cloudflare credentials.
        run: npm run db:migrate:remote -w apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the Worker
        run: npm run deploy -w apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
