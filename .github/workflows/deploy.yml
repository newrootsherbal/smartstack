# Deploys the Worker (and the web app it serves) on every push to main, so merging
# the weekly catalogue PR ships the new data. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN  — API token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID — the account id shown by `wrangler whoami`
# D1 migrations are NOT applied here; run `npm run db:migrate:remote -w apps/worker`
# by hand when a migration is added.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
