# Deploys the Worker (and the web app it serves) on every push to main, so merging
# the weekly catalogue PR ships the new data. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN  — an API token with Account > Workers Scripts > Edit on the
#                           newrootsherbal account (the "Edit Cloudflare Workers"
#                           template works too; it grants more than needed)
#   CLOUDFLARE_ACCOUNT_ID — the account id shown by `wrangler whoami`
# Deploying needs no D1 permission (the binding has its database_id). Migrations are
# NOT applied here; run `npm run db:migrate:remote -w apps/worker` by hand when one is added.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build the web app
        run: npm run build
      - name: Deploy the Worker
        # Only this step sees the Cloudflare credentials.
        run: npm run deploy -w apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
